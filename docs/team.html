<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="60">
<title>爆款雷达 · 还在加载</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0a0d13;color:#e8e8ea;text-align:center;padding:24px;
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .spin{width:34px;height:34px;margin:0 auto 26px;border:3px solid #2a2f3a;
        border-top-color:#ff785a;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:23px;margin:0 0 14px;font-weight:600}
  p{margin:8px 0;color:#9a9aa2;font-size:15px;line-height:1.75}
  .hint{margin-top:30px;font-size:13.5px;color:#6e6e78}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><div>
  <div class="spin"></div>
  <h1>你的页面还在加载中,请稍等</h1>
  <p>第一次大约需要 20-60 分钟。</p>
  <p>这一页会自己刷新,你可以先去忙别的。</p>
  <p class="hint">等很久都没变?回到安装 SOP 第 7 步,<br>到仓库的 Actions 看 Sync Content 有没有跑完。</p>
</div></body></html>
