<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ivan-Test-Viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>Ivan-Test-Viral<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

iPhones. But what really caught our attention was the price of the old ones. Old iPhones are getting more expensive. Usually when a new model comes out, the old ones get cheaper, but the iPhone 16, 17, and 17e are all going to be $100 more expensive. So what's going on here? It's actually part of a bigger trend of Apple's old technology getting more expensive. In June, Apple announced that a bunch of devices would be seeing a price hike, like this MacBook Pro, which costs $1,600 in 2025, then jumped up to $2,000 in June. Apple's reasoning, demand for memory and storage fueled by the rapid expansion of AI data centers. You see, three of the world's biggest chip makers are shifting production capacity away from the DRAM and NAND chips used in consumer electronics and toward HBM, a specialized type of memory used in AI data centers. If you're a memory chip company, obviously you're going to go to the best customers and right now, those are the AI companies. That leaves less production capacity for the other types of memory chips. As DRAM and NAND become harder to find, their prices rise, driving up costs for electronics companies like Apple. Apple is one of, if not the largest purchaser of a lot of these memory modules and stuff, at least for consumer facing hardware in the world. So for them to be facing the same difficulties with acquiring the pieces that they need to build their electronics is pretty remarkable. Apple has kind of lost control of the computer supply chain a little bit lately because it doesn't have a lot of AI data centers. To learn more about how the memory shortage is affecting prices for your electronics, watch the full video on Business Insider's YouTube channel.", "brk": "Hook类型: 反常识\n结构: 现象反常(旧手机变贵) → 深度揭秘(AI芯片抢产能) → 行业趋势(供应链失控)\n为什么火: 打破“新品发布旧机降价”的常规认知，将宏观AI热潮与消费者切身利益挂钩。\n改编角度: 从“iPhone旧机为何逆势涨价”切入，揭秘内存芯片短缺，提醒粉丝趁早维修旧机。", "my": "大家都在看最新的手机出了没，但真正让我觉得离谱的，是那些旧型号手机的维修费越来越贵了。\n\n通常情况下，手机用久了或者出了新款，换屏幕和零件的价格应该变便宜才对，但现在很多常见型号的维修成本反而一直在往上涨。\n\n所以这到底是为什么 e foot roughly. And then as we got busier, we needed more space. The first couple of years were not exactly a success. It was tough. It was stressful. Every month, we were losing money. For good two years, everything was wrong. There was no system in place. There was no accountability. Somebody's saying hi to us. We'll go talk to them. Now, so many Dacys come here, I actually ran into people I knew back in Pakistan. Which one? Hi. Malisa Coach. I actually know them. Oh, you can do it. I wondered when I would run into Parsi zoo. How are you doing? When we were kids. I know how to do it. School in the same like van and all of that stuff. So good to see you. So good to see you too, yeah. So what led to Agar's rise? When we bought it, it used to be Agar's Pakistani restaurant. We changed that to Indo Park restaurant. That was a big deal because now people recognize, okay, this is Indian and Pakistani restaurant. So we start getting a lot more customers. The owners focused on expanding the menu and improving the quality of the food. Chokat also went all in on the tech to provide customers with a smoother experience. I always compare Agar's to Apple, Microsoft, Google. What do they do that makes them successful? It's product, service and process.", "brk": "Hook类型: 身份共鸣\n结构: 零经验接盘烂摊子 → 连续两年血亏 → 逆袭成全国最火店铺\n为什么火: 一个完全不懂行的普通人，通过极致的产品与流程实现逆袭，完美触发了观众的逆袭爽感与好奇心。\n改编角度: 讲述一个修手机小白接手濒死档口，靠极致诚信和技术逆袭成商圈销冠的故事。", "my": "刚开始做 LumaNest 的时候，我其实连怎么帮小户型选一张合适的沙发都搞不懂。\n当时家里空间小、东西多，我和身边的人一样，去 IKEA 搬了一堆收纳盒回来，结果房间还是很乱。\n头两年真的吃了很多亏，买了很多尺寸不合、颜色不搭的东西，每个月都在交学费。\n直到后来帮越来越多和我们一样的小户型和租屋族看空间，才发现大家踩的坑都差不多。\n很多时候不是你家太小，是空间还没被用对。\n如果你现在也觉得家里东西没地方放、不知道怎么布置，先别急着买家具。\n点击主页链接，我们可以先做个免费的 15 分钟空间诊断，帮你看看目前最需要解决的是哪个问题。", "tags": "Houston, pakistanifood, indianfood, bigbusiness", "bait": false, "type": "Video", "likes": 5789, "comments": 86, "er": 0.12, "followers": 5034925, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdWrb5qFJXt/", "video": true, "ratio": 0, "score": 0.12, "status": "未处理", "x": 2.0}, {"id": "DdmGr6OFAzS", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "A layoff can turn everyday expenses into major decisions. These former tech workers explain how they adjusted their finances after losing high-paying jobs.\n\nFor some laid-off tech workers, severance ran out fast, leading them to sell stocks, rely on family, or make plans to relocate. \n\nHead to the link in our bio to learn more about what happens after you lose a six-figure job at one of the world's biggest tech companies.\n\n#bigtech #finances #lifelessons #layoff #career #jobs", "transcript": "Getting laid off definitely will show you where you went wrong with your finances. I am going to relocate to Charlotte, North Carolina because DC rent is way too much for me. The mortgage payment is something that drains our debts. We do think about maybe selling this house or bringing it up for rent. Everything is on the table, right? Moving is on the table. Once the severance was gone, I had to use up the savings that I was building. I had to sell stocks. I had to depend on my mom and dad for their support, which was really hard. It has definitely impacted the future plans I had, which eventually was hopefully to buy a house, to be able to buy my parents a house, to help them retire. I changed my spending habits to align more with my lack of income. You go out less, you cook more at home, you close out Netflix accounts or something like that, right? Things that are more entertainment versus essentials. One thing I did when I joined Google was actually planning a lot of my finances around the potential of being laid off. I kept a lot of my savings in cash, and I also didn't fully max out my retirement just because when you're laid off, the last thing you would want to worry about is, like, oh, how can I withdraw from my 401k or something? It's super scary at first. When you start pulling money out, you're just like, okay, here we go. How's this going to go? The biggest money lesson is invest, invest, invest. If you're saving, make sure that it is a high interest saving account so that your money isn't just sitting there, but also when you're purchasing, keep in mind, if I didn't have an income, would I still be able to afford this? I don't think that I plan for the what-ifs, and it costs me dearly. I would say the largest stressor for finances at right now is probably health insurance. In this country without health care, it could drain your accounts quite quickly. I've had medical provided my employer my entire life. I never have thought about this before. We pay $2,600 a month for medical, so that's a wake-up call to reality that a lot of Americans experience and have experienced all their life.", "brk": "Hook类型: 痛点直击\n结构: 遭遇裁员变故 → 盘点财务窘境与应对 → 反思与金钱教训\n为什么火: 直击大厂裁员背景下的财务焦虑，引发高薪群体的生存共鸣\n改编角度: 聚焦手机突然损坏但没钱修的窘境，探讨果粉/大厂员工的突发财务压力", "my": "刚搬进新家的时候，真的会让你发现自己在预算和空间规划上踩了多少坑。\n\n我最近准备把客厅稍微调整一下，因为原来的沙发买得太大，整个 layout 看起来超挤，动线完全不 practical。买家具的时候，如果没有先量好尺寸，真的很容易让空间变成灾难。每件家具都贴着墙，或者买了一堆收纳用品却发现东西根本没有自己的位置，这种感觉其实满崩溃的。\n\n我把一些不常坐的椅子先撤掉，把预算控制在 RM300 左右，先换了一盏光线比较柔和的床头灯，沙发和大型家具先别动。因为空间小、东西多的时候，如果盲目买一堆大件家具，最后不但超预算，还会让家里更乱。\n\n最大的布置经验就是，先规划，先量尺寸。如果你在买任何新家具之前，先想清楚这个 corner 每天真的会这样用吗？是不是真的符合生活习惯？才不会花冤枉钱。\n\n如果你家的客厅或卧室也是空间小、东西多、不知道怎么布置，可以先点主页链接，找我们聊聊。", "tags": "bigtech, finances, lifelessons, layoff, career, jobs", "bait": false, "type": "Video", "likes": 4360, "comments": 98, "er": 0.09, "followers": 5034925, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdmGr6OFAzS/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "DdSGtgxGygr", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Some CEOs have very strict agendas, but Julie Chapon, the 39-year-old CEO and cofounder of Yuka, doesn't like her day to be too defined.\n\nChapon used to work at a consultancy firm where she had no choice in what she did. When she started Yuka in France around 10 years ago, Chapon thought, \"OK, now no one's going to tell me what I have to do.\"\n\nYuka grew very quickly, and Chapon says she learned to say no, in a very polite way, to 80% of the emails she receives. Yuka has a yearly road map that she’s in charge of. “If I spend my time doing other things, I can't deliver,” Chapon says. \n\nChapon also said she used to put up barriers because she didn't feel like the right person for certain opportunities, even if she was. Now she just acts, and legitimacy comes.\n\nRead more about what a day in Chapon’s life as CEO looks like at the link in our bio.\n\nAs told to Kashmira Gander\n\n(Credit: Adélaïde Chantilly)\n\n#CEO #diml #dayinthelife", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 痛点引入 → 创业逆袭 → 核心方法论 → 开放式结局\n为什么火: 真实展现知名CEO反常规的日常，打破大众对精英高压生活的刻板印象。\n改编角度: 拍修手机老板的一天，展示如何靠拒绝奇葩客户和无理要求高效赚钱。", "my": "如果你的空间总觉得有点乱，先不要急着买一堆收纳盒。\n\n很多时候，出租屋看起来小，其实不是因为东西真的塞不下，而是因为动线和家具比例从一开始就没摆对。\n\n我以前也觉得，只要在网上看别人买什么，照着买回来家里就会变高级。结果呢？买回来的沙发尺寸不对，一进门把走道全挡住；买了一堆收纳篮，最后发现根本找不到放的地方。\n\n后来帮很多 600 sqft 的 condo 规划过才知道，重点不是 aesthetic，是你每天在里面用起来到底舒不舒服。\n\n如果你也正为小客厅或小卧室头疼，不用装修，也可以变很多。先别急着买家具，点主页链接可以申请免费的 15 分钟空间诊断，我们坐下来一起看看你家最需要先解决哪一个问题。", "tags": "CEO, diml, dayinthelife", "bait": false, "type": "Image", "likes": 3964, "comments": 137, "er": 0.08, "followers": 5034571, "date": "2026-09-14", "url": "https://www.instagram.com/p/DdSGtgxGygr/", "video": false, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "Ddb0Ldfgka5", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "After Brittney Ball was laid off from Meta, she submitted over 8,000 job applications with no luck. She even looked outside of tech, applying to work as a cashier at Target — but she was rejected. \n\n\"It kind of feels like a humiliation ritual,\" Ball said. \n\nBall and four other Big Tech workers share their experiences searching for employment after job loss. Some of them have decided to find income in other ways beyond traditional full-time jobs. \n\n#BigTech #layoffs #jobsearch #careers #lifelessons", "transcript": "I just didn't anticipate being unemployed for over a year. I've been unemployed for three months now and honestly when I was initially laid off I thought that I would have a job right now. I expected getting a job in maybe six months. Well, it's been a year. How do I explain it? I can't explain it. So far I have applied to about 30 jobs. I did look around for jobs. I just really wasn't very excited about anything. I'm sort of losing my patience. I've applied to over 8,000 jobs. 8,000 applications. 8,000 applications. And a lot of those jobs, they may not actually exist. I have her back from not even one of them, I believe. I think I've maybe gotten 10 final round interviews. And then you hear nothing. They ghosted you. Only to be told that, oh, we hired someone internally. Is it me? Is it them? What's happening? It kind of feels like a humiliation ritual. You do get a sense of loss of confidence. I applied to work cashier at Target and I was denied because I've been in tech for 15 years. I don't have any retail experience. You know, I'm 57. And you know, it is a crowded market. It's filled with young folks just coming into the job market. It's filled with highly skilled people who have just been laid off. There's a lot of them out there. And so how do you differentiate yourself from them? Because the job market is so competitive right now, you need to do something to set yourself apart. You can't just submit for a job these days. You can't just submit a resume and, you know, cross your fingers. To do job search in this market, you have to call attention to yourself. And that means you need to sell yourself more on social media. If you're an extrovert, that's great. If you're an introvert, that's much harder to do. I'm not comfortable with always being on camera. And so, Substack is a way for me to be introverted, but also extroverted in a way. Whatever your superpower is, you showcase it. One thing I focus now more with the free time I have is itchen. They have to follow strict dietary requirements, including limits on sodium and fat. When I started, the dietitians were running the kitchen. You have so many dietary restrictions, so the menus were pretty boring and very, very limited. So Tissols switched things up, putting chefs in charge of the menus, with dietitians guiding them along the way. We're going to have a different chef in each hospital, and we're going to let them express themselves and let the chef be creative. Creativity allows Bennett's team to come up with tasty dishes without compromising dietary needs. They use puree cauliflower instead of high-fat heavy cream and leaner proteins like fish and chicken to avoid red meats. And since foods can't be high in sodium, they go heavy on herbs and spices. As tickets continue to roll in, some of them list special dietary accommodations. Patients with dysphagia have trouble swallowing. It's a common problem for people who've had a stroke, so chefs will cut their salmon and mix it in gravy. So as long as we can get them to start eating and then realize, oh, this tastes great, even if it's modified texture, with one half the battle there. I decided to try the food out for myself to see if it's really up to restaurant standards. But it wasn't just these fancy dishes that surprised me. I ordered some of their special dietary options as well, like puree dishes for patients that have trouble swallowing. Here, they made their purees from scratch, like that salmon in gravy. Tastes like saucy salmon. Broccoli. Yeah, that just tastes like white broccoli. And short ribs. Okay, it's actually really good. I did not think I would be saying that. It's the texture of mashed potatoes, but it tastes like the short rib. It is so trippy on the brain.", "brk": "Hook类型: 反常识\n结构: 吐槽现状 → 颠覆做法 → 主播实测\n为什么火: 用米其林标准做极难吃的医院餐，反差感强且有悬念\n改编角度: 吐槽修手机行业黑幕，展示高难度主板修复过程并现场测试", "my": "如果你的客厅本来就不大，就别让每件家具都贴着墙。\n\n很多人刚搬进 500 sqft 到 900 sqft 的 condo，常常会去买一堆收纳盒和网红家具回来，结果发现空间不但没有变大，反而更挤了，买了 <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://ijptmjiuyifrwqbcxukt.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqcHRtaml1eWlmcndxYmN4dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTgxNzgsImV4cCI6MjEwMzg3NDE3OH0.lsOQ7XuUcNDklnJmBAk0LcW-epz3uI0GoABLD2ktcaU';
const STATUSES = ["未处理", "拍摄中", "已处理", "跳过"];
document.getElementById('updated').textContent = '更新于 2026-09-25 17:08 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = '全部';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["shotoniphone18pro", 5], ["newtrick", 2], ["apple", 2], ["houston", 2], ["texasfood", 2], ["bigbusiness", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: '黑马', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: '引流帖', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
