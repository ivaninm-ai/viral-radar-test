<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ivan-Test-Viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>Ivan-Test-Viral<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

emorychips", "transcript": "Apple just announced the prices of its newest iPhones. But what really caught our attention was the price of the old ones. Old iPhones are getting more expensive. Usually when a new model comes out, the old ones get cheaper, but the iPhone 16, 17, and 17e are all going to be $100 more expensive. So what's going on here? It's actually part of a bigger trend of Apple's old technology getting more expensive. In June, Apple announced that a bunch of devices would be seeing a price hike, like this MacBook Pro, which costs $1,600 in 2025, then jumped up to $2,000 in June. Apple's reasoning, demand for memory and storage fueled by the rapid expansion of AI data centers. You see, three of the world's biggest chip makers are shifting production capacity away from the DRAM and NAND chips used in consumer electronics and toward HBM, a specialized type of memory used in AI data centers. If you're a memory chip company, obviously you're going to go to the best customers and right now, those are the AI companies. That leaves less production capacity for the other types of memory chips. As DRAM and NAND become harder to find, their prices rise, driving up costs for electronics companies like Apple. Apple is one of, if not the largest purchaser of a lot of these memory modules and stuff, at least for consumer facing hardware in the world. So for them to be facing the same difficulties with acquiring the pieces that they need to build their electronics is pretty remarkable. Apple has kind of lost control of the computer supply chain a little bit lately because it doesn't have a lot of AI data centers. To learn more about how the memory shortage is affecting prices for your electronics, watch the full video on Business Insider's YouTube channel.", "brk": "Hook类型: 反常识\n结构: 现象反常(旧手机变贵) → 深度揭秘(AI芯片抢产能) → 行业趋势(供应链失控)\n为什么火: 打破“新品发布旧机降价”的常规认知，将宏观AI热潮与消费者切身利益挂钩。\n改编角度: 从“iPhone旧机为何逆势涨价”切入，揭秘内存芯片短缺，提醒粉丝趁早维修旧机。", "my": "很多人以为换手机越晚买越划算，但你有没有发现，现在买旧款手机或者送修的时候，价格反而越来越贵了？\n\n通常来说，新款出来旧款应该降价，但现在连修个旧手机或者换零件，费用都在变高。所以这到底是为什么呢？其实这跟整个零件供应链的变化有很大关系。\n\n现在全球的芯片厂都在把产能转去给那些大型数据中心和人工智能用。对芯片公司来说，谁出价高、需求大，他们就把产能转向谁，这就导致我们平时修手机用的这些普通零件和芯片越来越难找。\n\n零件变少，进货成本跟着涨，像我们这种每天帮大家修手机的人，拿零件的压力也越来越大。不管是屏幕、电池还是各种小零件，只要原厂供应链的成本一涨，大家修手机的费用自然就压不下来。\n\n如果你最近手机也遇到故障或者不知道该怎么处理，先别急着自己乱搞，可以发个信息给我们聊聊。", "tags": "Apple, iphoneduo, consumertech, AIdatacenters, memorychips", "bait": false, "type": "Video", "likes": 7561, "comments": 168, "er": 0.15, "followers": 5034571, "date": "2026-09-11", "url": "https://www.instagram.com/p/DdKb5EsDzCY/", "video": true, "ratio": 0, "score": 0.16, "status": "未处理", "x": 2.7}, {"id": "DdWrb5qFJXt", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "When Shaukat Maredia and his family bought Aga's in 2010, he barely knew how to make a cup of tea. After a steep learning curve and two years of losses, Maredia transformed the restaurant into one of the busiest in the country. \n\nBusiness Insider deputy executive producer Havovi Cooper goes inside Aga's to see how he did it. \n\n#Houston #pakistanifood #indianfood #bigbusiness", "transcript": "For Shaukat, owning a restaurant has come with a big learning curve that continues until today. At the time when we bought this restaurant, the only thing I knew how to make is maybe a cup of tea. Nobody knows anything in my family how to cook. Shaukat's family is from India and Pakistan. He moved to the US when he was 20 years old and picked up work wherever he could. I had three or four jobs going from dry cleaners and working for auto dealership. Then in 2010, his family approached him with an idea to buy a struggling restaurant. One of my brothers, Karim, and one of my cousins came to me and said, hey, this restaurant is for sale. Let's buy it. It's very funny that a week before this conversation, I had a really bad experience here. I laughed at it myself. Are you guys crazy? They paid less for the whole restaurant than what it now makes in a single weekend. When we originally acquired this was the space. This one all the way back was 6,000 square foot roughly. And then as we got busier, we needed more space. The first couple of years were not exactly a success. It was tough. It was stressful. Every month, we were losing money. For good two years, everything was wrong. There was no system in place. There was no accountability. Somebody's saying hi to us. We'll go talk to them. Now, so many Dacys come here, I actually ran into people I knew back in Pakistan. Which one? Hi. Malisa Coach. I actually know them. Oh, you can do it. I wondered when I would run into Parsi zoo. How are you doing? When we were kids. I know how to do it. School in the same like van and all of that stuff. So good to see you. So good to see you too, yeah. So what led to Agar's rise? When we bought it, it used to be Agar's Pakistani restaurant. We changed that to Indo Park restaurant. That was a big deal because now people recognize, okay, this is Indian and Pakistani restaurant. So we start getting a lot more customers. The owners focused on expanding the menu and improving the quality of the food. Chokat also went all in on the tech to provide customers with a smoother experience. I always compare Agar's to Apple, Microsoft, Google. What do they do that makes them successful? It's product, service and process.", "brk": "Hook类型: 身份共鸣\n结构: 零经验接盘烂摊子 → 连续两年血亏 → 逆袭成全国最火店铺\n为什么火: 一个完全不懂行的普通人，通过极致的产品与流程实现逆袭，完美触发了观众的逆袭爽感与好奇心。\n改编角度: 讲述一个修手机小白接手濒死档口，靠极致诚信和技术逆袭成商圈销冠的故事。", "my": "刚接手这间修手机的店时，我其实连怎么拆开屏幕都不懂，家里也没人搞过这个。\n\n当时我二十岁，在外面打过好几份工，干过洗车，也帮人搬过货。直到有天朋友问我，有一家开不下去的手机维修店要转让，你要不要接手？我当时觉得他们简直疯了，我连一颗螺丝都装不好，怎么修手机？\n\n但最后还是硬着头皮顶下来了。刚开始那两年，日子非常难。每个月都在亏钱，店里连个像样的零件分类系统都没有，工具乱放，顾客拿来修的手机还经常找不到。每天一开门就头大，完全不知道从哪里开始下手。\n\n为什么后来能做起来？因为我把流程彻底理顺了。以前修手机全凭感觉，螺丝乱丢，客户问进度也答不上来。后来我们开始把每一个步骤标准化，从检测问题、报价、拆机到测试，全部按标准流程走。只要把产品、服务和流程做好，客户自然会信任你。\n\n空间小、东西多、不知道怎么布置，就像修手机一样，只要把杂乱的步骤理清楚，其实不用装修，也可以变很多。点我们主页链接，先来做个免费的线上空间诊断。", "tags": "Houston, pakistanifood, indianfood, bigbusiness", "bait": false, "type": "Video", "likes": 5789, "comments": 86, "er": 0.12, "followers": 5034925, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdWrb5qFJXt/", "video": true, "ratio": 0, "score": 0.12, "status": "未处理", "x": 2.0}, {"id": "DdmGr6OFAzS", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "A layoff can turn everyday expenses into major decisions. These former tech workers explain how they adjusted their finances after losing high-paying jobs.\n\nFor some laid-off tech workers, severance ran out fast, leading them to sell stocks, rely on family, or make plans to relocate. \n\nHead to the link in our bio to learn more about what happens after you lose a six-figure job at one of the world's biggest tech companies.\n\n#bigtech #finances #lifelessons #layoff #career #jobs", "transcript": "Getting laid off definitely will show you where you went wrong with your finances. I am going to relocate to Charlotte, North Carolina because DC rent is way too much for me. The mortgage payment is something that drains our debts. We do think about maybe selling this house or bringing it up for rent. Everything is on the table, right? Moving is on the table. Once the severance was gone, I had to use up the savings that I was building. I had to sell stocks. I had to depend on my mom and dad for their support, which was really hard. It has definitely impacted the future plans I had, which eventually was hopefully to buy a house, to be able to buy my parents a house, to help them retire. I changed my spending habits to align more with my lack of income. You go out less, you cook more at home, you close out Netflix accounts or something like that, right? Things that are more entertainment versus essentials. One thing I did when I joined Google was actually planning a lot of my finances around the potential of being laid off. I kept a lot of my savings in cash, and I also didn't fully max out my retirement just because when you're laid off, the last thing you would want to worry about is, like, oh, how can I withdraw from my 401k or something? It's super scary at first. When you start pulling money out, you're just like, okay, here we go. How's this going to go? The biggest money lesson is invest, invest, invest. If you're saving, make sure that it is a high interest saving account so that your money isn't just sitting there, but also when you're purchasing, keep in mind, if I didn't have an income, would I still be able to afford this? I don't think that I plan for the what-ifs, and it costs me dearly. I would say the largest stressor for finances at right now is probably health insurance. In this country without health care, it could drain your accounts quite quickly. I've had medical provided my employer my entire life. I never have thought about this before. We pay $2,600 a month for medical, so that's a wake-up call to reality that a lot of Americans experience and have experienced all their life.", "brk": "Hook类型: 痛点直击\n结构: 遭遇裁员变故 → 盘点财务窘境与应对 → 反思与金钱教训\n为什么火: 直击大厂裁员背景下的财务焦虑，引发高薪群体的生存共鸣\n改编角度: 聚焦手机突然损坏但没钱修的窘境，探讨果粉/大厂员工的突发财务压力", "my": "搬进新的 condo 之后，看着那堆没地方塞的快递箱和永远摆不对位置的沙发，真的会让你发现自己当初买家具的时候走过多少弯路。\n\n我本来想把每个角落都塞满，结果现在客厅挤得连转个身都难，动线完全卡死。我们甚至考虑过把几件大件家具直接转手卖掉，或者干脆重新换一套尺寸合适的。什么方案都想过，对吧？重新摆放也是个办法。\n\n等网购了一堆收纳盒和装饰品全寄到家里之后，我才发现空间根本不够用，只能把东西到处乱塞。我还去了好几家家居店买了一堆回来，结果尺寸完全不搭，这真的很让人头疼。它确实打乱了我原本对这个家的规划，本来我是希望下班回家能觉得舒服、整齐，有个真正能好好休息的地方。\n\n我后来开始调整我的布置习惯，来配合这个空间不大的现实。你少买一点大件，多留一点空隙，把沙发控制在 180cm 左右，或者像那种角落直接留白，不要让每件家具都贴着墙。\n\n其实很多人刚搬家的时候，都会犯一个同样的错误，就是把所有东西都买回来，结果发现房间一点空间都没有了。\n\n刚开始的时候真的有点手忙脚乱，当你开始一件件搬开、重新量尺寸的时候，你就会想，好吧，这次总算知道怎么弄了。\n\n最大的经验就是买对一点，少买一点。如果你的客厅本来就不大，买家具之前先量好尺寸，看看如果空间小，放了是不是真的好用。\n\n我以前真的没有想过小户型会这么考验空间规划，交了不少学费。\n\n如果要说现在布置家里最大的痛点，大概就是收纳根本不够。在这个地方如果东西没有自己的位置，家里的桌面和地板很快就会堆满杂物，真的很让人头疼。\n\n我以前从来没想过整理房间这么花心思，这也算是一个挺现实的体验。\n\n如果你也觉得家里的空间不大、东西总是没地方放，可以先点击主页链接找我们聊聊。", "tags": "bigtech, finances, lifelessons, layoff, career, jobs", "bait": false, "type": "Video", "likes": 4360, "comments": 98, "er": 0.09, "followers": 5034925, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdmGr6OFAzS/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "DdSGtgxGygr", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Some CEOs have very strict agendas, but Julie Chapon, the 39-year-old CEO and cofounder of Yuka, doesn't like her day to be too defined.\n\nChapon used to work at a consultancy firm where she had no choice in what she did. When she started Yuka in France around 10 years ago, Chapon thought, \"OK, now no one's going to tell me what I have to do.\"\n\nYuka grew very quickly, and Chapon says she learned to say no, in a very polite way, to 80% of the emails she receives. Yuka has a yearly road map that she’s in charge of. “If I spend my time doing other things, I can't deliver,” Chapon says. \n\nChapon also said she used to put up barriers because she didn't feel like the right person for certain opportunities, even if she was. Now she just acts, and legitimacy comes.\n\nRead more about what a day in Chapon’s life as CEO looks like at the link in our bio.\n\nAs told to Kashmira Gander\n\n(Credit: Adélaïde Chantilly)\n\n#CEO #diml #dayinthelife", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 痛点引入 → 创业逆袭 → 核心方法论 → 开放式结局\n为什么火: 真实展现知名CEO反常规的日常，打破大众对精英高压生活的刻板印象。\n改编角度: 拍修手机老板的一天，展示如何靠拒绝奇葩客户和无理要求高效赚钱。", "my": "如果你的客厅只有 600 sqft，先不要买这张沙发。\n\n很多人刚搬进自己的第一间出租屋或者小型 condo 的时候，总觉得要把每个角落都填满，去买了一堆东西回来。结果发现动线变得很挤，家里看起来还是乱七八糟的。\n\n其实空间小、东西多、不知道怎么布置，最大的问题不是因为地方不够，而是家具比例不对，或者收纳没有放在对的位置。\n\n你不需要花几十万去装修，也不用把整个家翻新。如果房间总觉得有点乱，可以先检查这 5 个地方，把那些挡路或者颜色不搭的家具挪开，留一点空隙出来。\n\n不用装修，也可以变很多。", "tags": "CEO, diml, dayinthelife", "bait": false, "type": "Image", "likes": 3964, "comments": 137, "er": 0.08, "followers": 5034571, "date": "2026-09-14", "url": "https://www.instagram.com/p/DdSGtgxGygr/", "video": false, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "Ddb0Ldfgka5", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "After Brittney Ball was laid off from Meta, she submitted over 8,000 job applications with no luck. She even looked outside of tech, applying to work as a cashier at Target — but she was rejected. \n\n\"It kind of feels like a humiliation ritual,\" Ball said. \n\nBall and four other Big Tech workers share their experiences searching for employment after job loss. Some of them have decided to find income in other ways beyond traditional full-time jobs. \n\n#BigTech #layoffs #jobsearch #careers #lifelessons", "transcript": "I just didn't anticipate being unemployed for over a year. I've been unemployed for three months now and honestly when I was initially laid off I thought that I would have a job right now. I expected getting a job in maybe six months. Well, it's been a year. How do I explain it? I can't explain it. So far I have applied to about 30 jobs. I did look around for jobs. I just really wasn't very excited about anything. I'm sort of losing my patience. I've applied to over 8,000 jobs. 8,000 applications. 8,000 applications. And a lot of those jobs, they may not actually exist. I have her back from not even one of them, I believe. I think I've maybe gotten 10 final round interviews. And then you hear nothing. They ghosted you. Only to be told that, oh, we hired someone internally. Is it me? Is it them? What's happening? It kind of feels like a humiliation ritual. You do get a sense of loss of confidence. I applied to work cashier at Target and I was denied because I've been in tech for 15 years. I don't have any retail experience. You know, I'm 57. And you know, it is a crowded market. It's filled with young folks just coming into the job market. It's filled with highly skilled people who have just been laid off. There's a lot of them out there. And so how do you differentiate yourself from them? Because the job market is so competitive right now, you need to do something to set yourself apart. You can't just submit for a job these days. You can't just submit a resume and, you know, cross your fingers. To do job search in this market, you have to call attention to yourself. And that means you need to sell yourself more on social media. If you're an extrovert, that's great. If you're an introvert, that's much harder to do. I'm not comfortable with always being on camera. And so, Substack is a way for me to be introverted, but also extroverted in a way. Whatever your superpower is, you showcase it. One thing I focus now more with the free time I have is content creation. And the core of that is really just building something for myself that no one can take away. Today is the first day since I got laid off. And it just feels weird. No morning meetings, no chat messages, no stand up to attend. It is really important for people to have more than one source of income since I started building my own brand. And I posted my layoff story. I have been reached out by a lot of recruiters and even non-tech job opportunities because when you build a personal brand on social media, you're also learning marketing.", "brk": "Hook类型: 痛点直击\n结构: 遭遇裁员绝望求职 → 吐露海投8000次被拒心声 → 转向副业与自媒体自救\n为什么火: 直面大厂裁员与求职地狱模式的残酷现实，引发庞大失业人群强烈共鸣。\n改编角度: 吐槽某些手机店恶意压价或套路维修，引发用户对行业内幕的共鸣与讨论。", "my": "我买了很多收纳用品，却还是很乱，是不是只有我有这种感觉？\n\n搬进小 500 到 900 平方尺的 condo 之后，我去了宜家、淘宝买了一堆收纳箱、置物架回来。结果呢？不仅尺寸不合、颜色不搭，整个家看起来还是非常挤，东西根本没有自己的位置。\n\n你想找个东西，要把抽屉翻个底朝天。网上的美图看了一大堆，自己动手的时候却完全不是那么回事。有时候真的会怀疑，是不是我的空间有问题，还是我根本不会过日子？\n\n其实不是你家太小，是空间还没被用对。很多人买了很多收纳用品，却漏掉了最核心的家具比例和动线问题。\n\n如果空间总觉得有点乱，先别急着买家具，也别花大钱去做不能带走的装修。你可以先看看主页，点链接申请免费的十五分钟空间诊断，让我们帮你看看到底是哪里卡住了。\n\n不用装修，也可以变很多。", "tags": "BigTech, layoffs, jobsearch, careers, lifelessons", "bait": false, "type": "Video", "likes": 3698, "comments": 111, "er": 0.08, "followers": 5034925, "date": "2026-09-18", "url": "https://www.instagram.com/p/Ddb0Ldfgka5/", "video": true, "ratio": 0, "score": 0.08, "status": "未处理", "x": 1.3}, {"id": "Ddolyozicfu", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Hospital food doesn't have to be bland. At Northwell Health, a hospital network in New York, chefs are taking the lead on menus, with dietitians guiding them to meet patients' medical needs.\n\nFor patients with swallowing difficulties, for example, chefs create made-from-scratch pureed meals like saucy salmon and short ribs. \n\nLearn more about how fine dining chefs are making their mark on hospital food at the link in bio. \n\n#kitchen #finedining #restaurant #michelin #bigbusiness", "transcript": "Hospital chefs can't use as many ingredients as a typical restaurant kitchen. They have to follow strict dietary requirements, including limits on sodium and fat. When I started, the dietitians were running the kitchen. You have so many dietary restrictions, so the menus were pretty boring and very, very limited. So Tissols switched things up, putting chefs in charge of the menus, with dietitians guiding them along the way. We're going to have a different chef in each hospital, and we're going to let them express themselves and let the chef be creative. Creativity allows Bennett's team to come up with tasty dishes without compromising dietary needs. They use puree cauliflower instead of high-fat heavy cream and leaner proteins like fish and chicken to avoid red meats. And since foods can't be high in sodium, they go heavy on herbs and spices. As tickets continue to roll in, some of them list special dietary accommodations. Patients with dysphagia have trouble swallowing. It's a common problem for people who've had a stroke, so chefs will cut their salmon and mix it in gravy. So as long as we can get them to start eating and then realize, oh, this tastes great, even if it's modified texture, with one half the battle there. I decided to try the food out for myself to see if it's really up to restaurant standards. But it wasn't just these fancy dishes that surprised me. I ordered some of their special dietary options as well, like puree dishes for patients that have trouble swallowing. Here, they made their purees from scratch, like that salmon in gravy. Tastes like saucy salmon. Broccoli. Yeah, that just tastes like white broccoli. And short ribs. Okay, it's actually really good. I did not think I would be saying that. It's the texture of mashed potatoes, but it tastes like the short rib. It is so trippy on the brain.", "brk": "Hook类型: 反常识\n结构: 吐槽现状 → 颠覆做法 → 主播实测\n为什么火: 用米其林标准做极难吃的医院餐，反差感强且有悬念\n改编角度: 吐槽修手机行业黑幕，展示高难度主板修复过程并现场测试", "my": "如果你家的客厅只有 600 sqft，先别让每件家具都贴着墙。\n\n很多人觉得小户型空间很小、东西又多，买了一堆收纳用品却还是很乱，其实不是因为你不会买，是因为空间还没被用对。就像有些人的房间总觉得很挤，是因为布局把走线全挡住了。\n\n我们帮很多屋主规划空间时发现，如果客厅本来就不大，先不要买那种 180cm 以上的大沙发。留一点空隙，反而会让空间看起来更松。\n\n不用装修，也可以变很多。先解决最影响生活的那一个问题，重点是钱花在哪里。\n\n如果你也觉得家里空间不够用，点主页链接，我们来帮你看看。", "tags": "kitchen, finedining, restaurant, michelin, bigbusiness", "bait": false, "type": "Video", "likes": 3447, "comments": 18, "er": 0.07, "followers": 5034925, "date": "2026-09-23", "url": "https://www.instagram.com/p/Ddolyozicfu/", "video": true, "ratio": 0, "score": 0.07, "status": "未处理", "x": 1.2}, {"id": "DdhBJJZl9Vc", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "May Lee joined Hewlett-Packard in 1987 as a software engineer intern. As a graduate, she wanted to sign on for life with a good company that she knew she could be loyal to and would be as loyal as a company could be.\n\nLee didn't want to climb the corporate ladder or jump from company to company. If she hadn't been downsized last February, Lee would never have left.\n\nShe says there were signs that the writing was on the wall, such as a hiring freeze and a temporary reduction in her work hours, but in the end, it came as a surprise. Lee had hoped to work there for probably another five-something years.\n\nLee says she felt a combination of disappointment and sadness. This was the company she had devoted her entire career to and had hoped to retire from.\n\nRead more to see how Lee navigated her layoff at the link in our bio.\n\nStory by Roya Shahidi\n\n(Credit: May Lee)\n\n ew internet controversy. There's a growing number of videos on social media platforms encouraging squishy owners, many of poor kids, to freeze or microwave their toys to improve the texture. The results can be disastrous. We spoke to the mom of a 10-year-old who microwaved for squishy to make it softer. Afterward, it burst, and Ballard Zert spent nine days in the hospital recovering from burns to her face and chest. She however is not alone. Poison control told Business Insider to squishy-related incidents in the US have more than double this year. Despite that, the squishy craze hasn't cooled. Retailers have sold more than $700 million worth of them since 2023. The Business Insider is reporting to end another problem. Knock-off squishies are flooding the online market and vendors are not required to say what's inside of them. Nido, one of the most common brands, says its original toy is made of polyvinyl alcohol. Similar to the vinyl and white glue. Material like that can get brittle and rupture when heated. Other brands like Splatball don't list their ingredients at all. In August, CPSC weighed in, warning against microwaving squishies, and revealing it had blocked more than 640,000 items from entering the US. For more on the rise of the squishy toys and the risks potentially inside them, head to Business Insider. Oh! Look, it burst. Look, it burst.", "brk": "Hook类型: 痛点直击+悬念\n结构: 玩具爆炸事故 → 行业监管漏洞 → 揭秘劣质材质\n为什么火: 结合儿童受伤的社会热点与信息差，精准触发家长焦虑\n改编角度: 曝光华人在海外买到劣质山寨手机的爆炸/漏液惨剧，警示贪便宜风险", "my": "如果你的客厅只有 600 sqft，先别急着盲目买一堆收纳箱回来。很多人在网上看到各种整齐的房间照片，结果自己去买了一堆盒子回来，发现家里看起来还是很乱。其实问题很简单，不是你买得不够多，而是你的空间还没有被用对。很多人以为买了很多收纳用品就能解决问题，但常常尺寸根本不合，或者动线全被堵住了。如果你最近也觉得家里东西太多、空间太小，不知道怎么布置，可以先点主页链接申请我们的免费线上空间诊断。", "tags": "", "bait": false, "type": "Video", "likes": 3168, "comments": 95, "er": 0.06, "followers": 5034925, "date": "2026-09-19", "url": "https://www.instagram.com/p/DdeZG_RFQZ9/", "video": true, "ratio": 0, "score": 0.07, "status": "未处理", "x": 1.2}, {"id": "DdZFDDRl_b_", "tracker": "Ivan       ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
