<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ivan-Test-Viral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13;
    --card: #11151d;
    --card-hi: #151a24;
    --border: #1d2430;
    --border-hi: #2c3546;
    --text: #e8ecf3;
    --muted: #8a94a6;
    --faint: #5b6577;
    --accent: #5ea1ff;
    --green: #3fd68f;
    --orange: #f0a33f;
    --pink: #ff6b9d;
    --red: #ff5c5c;
    --fire1: #ff8a3d;
    --fire2: #ff4d6d;
    --font: 'Inter', -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --disp: 'Space Grotesk', 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scrollbar-color: #232c3b var(--bg); }
  body { background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(94,161,255,.3); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #232c3b; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #2c3546; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .ic { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

  header { position: sticky; top: 0; z-index: 50; background: rgba(10,13,19,.86);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border); padding: 13px 20px 12px; }
  .hrow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; max-width: 1440px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .mark { width: 31px; height: 31px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--fire1), var(--fire2));
    box-shadow: 0 4px 16px rgba(255,92,80,.35); }
  .mark .ic { width: 17px; height: 17px; color: #fff; }
  h1 { font-family: var(--disp); font-size: 16.5px; font-weight: 700; letter-spacing: .2px; white-space: nowrap; line-height: 1.15; }
  h1 small { display: block; color: var(--faint); font-family: var(--font); font-weight: 400;
    font-size: 10.5px; letter-spacing: 0; }

  .search { position: relative; }
  .search > .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--faint); width: 13.5px; pointer-events: none; }
  input#fSearch { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px 8px 32px; font-size: 13px; font-family: var(--font);
    width: 200px; transition: border-color .18s, background .18s; }
  input#fSearch:hover { border-color: var(--border-hi); }
  input#fSearch:focus { border-color: var(--accent); outline: none; }
  input#fSearch::placeholder { color: var(--faint); }

  select, .btn { background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 13px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s, color .18s;
    display: inline-flex; align-items: center; gap: 6px; }
  select:hover, .btn:hover { border-color: var(--border-hi); background: var(--card-hi); }
  .btn:active { transform: scale(.97); }
  .btn.on { border-color: var(--accent); color: var(--accent); background: rgba(94,161,255,.08); }

  .tabs { display: flex; gap: 7px; flex-wrap: wrap; max-width: 1440px; margin: 12px auto 0; }
  .tab { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 6.5px 14px;
    font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, background .18s, color .18s, transform .18s; }
  .tab:hover { border-color: var(--border-hi); color: var(--text); }
  .tab .cnt { font-family: var(--disp); font-weight: 600; font-size: 11px;
    background: rgba(255,255,255,.06); padding: 1.5px 7.5px; border-radius: 99px;
    font-variant-numeric: tabular-nums; }
  .tab.on { color: var(--text);
    background: linear-gradient(135deg, rgba(255,138,61,.15), rgba(255,77,109,.15));
    border-color: rgba(255,120,90,.45); }
  .tab.on .cnt { background: rgba(255,120,90,.25); }
  body.dragging .tab.droppable { border-style: dashed; border-color: var(--accent); }
  .tab.over { background: rgba(94,161,255,.22); color: var(--text); transform: scale(1.07); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 1440px; margin: 9px auto 0; align-items: center; }
  .chips .lbl { font-size: 12px; color: var(--faint); margin-right: 2px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5.5px; background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 4.5px 12px;
    font-size: 12px; color: var(--muted); cursor: pointer; user-select: none;
    transition: border-color .18s, color .18s, background .18s;
    font-variant-numeric: tabular-nums; }
  .chip2 .ic { width: 12.5px; height: 12.5px; }
  .chip2:hover { border-color: var(--border-hi); color: var(--text); }
  .chip2.on { border-color: rgba(240,163,63,.6); color: var(--orange); background: rgba(240,163,63,.08); }

  main { max-width: 1440px; margin: 22px auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(305px, 1fr)); gap: 18px; }

  .card { position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    transition: transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
    animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .card:hover { transform: translateY(-3px); border-color: var(--border-hi);
    box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .card.outlier::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--fire1), var(--fire2)); z-index: 2; }
  .card[draggable] { cursor: grab; }
  .card.lifting { opacity: .45; }
  .card.saved { border-color: var(--green); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .embed { position: relative; width: 100%; aspect-ratio: 4/5; background: #080b10; }
  .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .embed .ph { position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(110deg, #0b0e15 8%, #121826 18%, #0b0e15 33%);
    background-size: 200% 100%; animation: shimmer 1.5s linear infinite; }
  .embed .ph .ic { width: 30px; height: 30px; color: #2a3342; stroke-width: 1.6; }
  @keyframes shimmer { to { background-position-x: -200%; } }

  .meta { padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row1 { display: flex; align-items: center; gap: 7px; font-size: 13px; flex-wrap: wrap; }
  .handle { color: #3a4456; cursor: grab; display: inline-flex; }
  .handle .ic { width: 13px; height: 13px; }
  .who { font-weight: 600; color: var(--accent); text-decoration: none; }
  .who:hover { text-decoration: underline; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 500;
    padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge .ic { width: 10.5px; height: 10.5px; }
  .badge.bnew { color: var(--pink); border-color: rgba(255,107,157,.45); background: rgba(255,107,157,.07); }
  .badge.bhorse { color: var(--orange); border-color: rgba(240,163,63,.45); background: rgba(240,163,63,.07); }
  .badge.bbait { color: var(--accent); border-color: rgba(94,161,255,.4); background: rgba(94,161,255,.07); }
  .date { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

  .nums { display: flex; gap: 6px; flex-wrap: wrap; }
  .num { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    border: 1px solid var(--border); border-radius: 9px; padding: 5px 9px;
    font-size: 11px; color: var(--muted); }
  .num .ic { width: 11.5px; height: 11.5px; }
  .num b { font-family: var(--disp); color: var(--text); font-size: 12.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .num.hot { border-color: rgba(255,122,77,.35); }
  .num.hot .ic, .num.hot b { color: #ff7a4d; }
  .num.x { border-color: rgba(240,163,63,.35); }
  .num.x .ic, .num.x b { color: var(--orange); }
  .num.er .ic, .num.er b { color: var(--green); }

  .cap { color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .cap.open { -webkit-line-clamp: unset; }
  .cap b { color: var(--text); font-weight: 600; }
  .ai { border-left: 2px solid var(--orange); background: rgba(240,163,63,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); }
  .ai b { color: var(--orange); font-weight: 600; }
  .mine { border-left: 2px solid var(--green); background: rgba(63,214,143,.06);
    padding: 8px 11px; border-radius: 0 10px 10px 0; font-size: 12px; line-height: 1.65;
    color: var(--muted); cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4;
    -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .mine.open { -webkit-line-clamp: unset; }
  .mine b { color: var(--green); font-weight: 600; }

  .srow { display: flex; align-items: center; gap: 7px; }
  .srow label { font-size: 12px; color: var(--faint); }
  .status { flex: 1; padding: 6px 9px; font-size: 12.5px; }
  .status.s未处理 { color: var(--muted); }
  .status.s拍摄中 { color: var(--orange); border-color: rgba(240,163,63,.5); }
  .status.s已处理 { color: var(--green); border-color: rgba(63,214,143,.5); }
  .status.s跳过 { color: var(--red); border-color: rgba(255,92,92,.5); }
  .abtn { display: inline-flex; align-items: center; gap: 5px; background: #0c0f16;
    color: var(--muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 6px 10px; font-size: 11.5px; font-family: var(--font); cursor: pointer;
    text-decoration: none; transition: color .18s, border-color .18s, transform .1s; }
  .abtn .ic { width: 12px; height: 12px; }
  .abtn:hover { color: var(--accent); border-color: rgba(94,161,255,.5); }
  .abtn:active { transform: scale(.95); }

  .more { text-align: center; margin: 28px 0 44px; }
  .more button { background: var(--card); color: var(--accent); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 30px; font-size: 14px; font-family: var(--font);
    cursor: pointer; transition: border-color .18s, background .18s; }
  .more button:hover { border-color: var(--border-hi); background: var(--card-hi); }

  .empty { color: var(--faint); text-align: center; padding: 70px 0; display: flex;
    flex-direction: column; align-items: center; gap: 12px; font-size: 14px; }
  .empty .ic { width: 34px; height: 34px; stroke-width: 1.5; color: #2c3546; }

  footer { color: var(--faint); font-size: 11px; text-align: center; padding: 22px; }

  #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--card-hi); border: 1px solid var(--border-hi); border-radius: 11px;
    padding: 11px 20px; font-size: 13px; display: none; z-index: 99; opacity: 0;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; }
  #toast.show { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

</svg>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="mark"><svg class="ic"><use href="#i-flame"/></svg></div>
      <h1>Ivan-Test-Viral<small id="updated"></small></h1>
    </div>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg>
      <input id="fSearch" placeholder="搜文案 / hashtag / 账号"></div>
    <select id="fTracker"><option value="">全部 Tracker</option></select>
    <select id="fComp"><option value="">全部 Competitor</option></select>
    <select id="fSort">
      <option value="x">按 爆款倍数 (vs 自家平均)</option>
      <option value="score">按 Viral Score</option>
      <option value="er">按 Engagement Rate</option>
      <option value="comments">按 Comments</option>
      <option value="likes">按 Likes</option>
      <option value="date">按 最新日期</option>
    </select>
    <button class="btn" id="fVideo"><svg class="ic"><use href="#i-video"/></svg>只看视频</button>

    <a class="btn" href="team.html" target="_top" title="工作台"><svg class="ic"><use href="#i-users"/></svg>工作台</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="chips" id="presets"></div>
  <div class="chips" id="trends"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><svg class="ic"><use href="#i-search"/></svg>没有符合条件的帖子</div>
  <div class="more" id="moreWrap" style="display:none"><button id="moreBtn">载入更多</button></div>
</main>

红家具回来。结果摆上去才发现，客厅看起来还是很挤，走路动线很卡，买了很多收纳箱却还是觉得东西没有地方放。\n\n你可能以为是自己的空间太小了，或者觉得一定要花大钱找传统的室内设计公司做全屋装修，才能把家里的空间变大。\n\n其实不是你家太小，也不是因为你没有花几万块钱装修，而是因为空间的比例和布局还没用对。很多人买沙发的时候，一不小心就买得太大了，或者把 corner 空间完全浪费掉，导致整个 layout 看起来很不 practical。\n\n这里有三个普通人自己也能做到的方法，不需要大动土木，也不用花大钱。\n\n第一，沙发控制在 180cm 左右。如果你的客厅本来就不大，就别买那些笨重的大 L 型沙发。小尺寸的沙发能给客厅留出更多空隙，反而会让空间看起来更松，走动的时候也不会一直撞到。\n\n第二，善用角落的 vertical space。房间经常显得乱，是因为东西都堆在地上。如果有一个 corner 完全被浪费掉了，可以放一个小型置物架或者移动推车，把常用的杂物收进去，让地面保持干净。\n\n第三，用灯光来分担视觉层次。小空间最怕只有一盏大顶灯，照得整个房间没有隐私感。在床头或者客厅角落放一盏 RM49 到 RM250 左右的氛围灯或落地灯，不仅好用，也能让空间看起来更有温度。\n\n以前很多客户自己去 IKEA 或 Shopee 买了一堆东西，结果颜色不搭、尺寸不合，花了很多冤枉钱，房间还是乱七八糟。\n\n用了对的布局和尺寸规划之后，不用花大钱做那些不能带走的装修，也能让空间看起来整齐舒服，每天回家都有自己的风格。\n\n如果你现在也正面临空间小、东西多、不知道怎么布置的问题，可以点击主页链接，先申请一个免费的 15 分钟线上空间诊断。发几张房间照片给我们，我们帮你看看目前最大的问题是什么，再告诉你接下来可以先改善哪里。", "tags": "ShotoniPhone", "bait": false, "type": "Carousel", "likes": 69631, "comments": 418, "er": 0.19, "followers": 37735157, "date": "2026-08-12", "url": "https://www.instagram.com/p/Db8iyXEG8Nb/", "video": false, "ratio": 0, "score": 0.19, "status": "未处理", "x": 0.3}, {"id": "DdKb5EsDzCY", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Usually, older iPhones get cheaper when a new model comes out. But the iPhone 16, 17, and 17e are all getting $100 more expensive.\n\nBusiness Insider looks at what's behind the price increases, including the growing demand for memory and storage from AI data centers.\n\n#Apple #iphoneduo  #consumertech #AIdatacenters #memorychips", "transcript": "Apple just announced the prices of its newest iPhones. But what really caught our attention was the price of the old ones. Old iPhones are getting more expensive. Usually when a new model comes out, the old ones get cheaper, but the iPhone 16, 17, and 17e are all going to be $100 more expensive. So what's going on here? It's actually part of a bigger trend of Apple's old technology getting more expensive. In June, Apple announced that a bunch of devices would be seeing a price hike, like this MacBook Pro, which costs $1,600 in 2025, then jumped up to $2,000 in June. Apple's reasoning, demand for memory and storage fueled by the rapid expansion of AI data centers. You see, three of the world's biggest chip makers are shifting production capacity away from the DRAM and NAND chips used in consumer electronics and toward HBM, a specialized type of memory used in AI data centers. If you're a memory chip company, obviously you're going to go to the best customers and right now, those are the AI companies. That leaves less production capacity for the other types of memory chips. As DRAM and NAND become harder to find, their prices rise, driving up costs for electronics companies like Apple. Apple is one of, if not the largest purchaser of a lot of these memory modules and stuff, at least for consumer facing hardware in the world. So for them to be facing the same difficulties with acquiring the pieces that they need to build their electronics is pretty remarkable. Apple has kind of lost control of the computer supply chain a little bit lately because it doesn't have a lot of AI data centers. To learn more about how the memory shortage is affecting prices for your electronics, watch the full video on Business Insider's YouTube channel.", "brk": "Hook类型: 反常识\n结构: 现象反常(旧手机变贵) → 深度揭秘(AI芯片抢产能) → 行业趋势(供应链失控)\n为什么火: 打破“新品发布旧机降价”的常规认知，将宏观AI热潮与消费者切身利益挂钩。\n改编角度: 从“iPhone旧机为何逆势涨价”切入，揭秘内存芯片短缺，提醒粉丝趁早维修旧机。", "my": "如果你的客厅只有 600 sqft，先不要买这套沙发。\n\n很多人以为，空间变大一定要花大钱换房子，或者去买一堆几千块的大型家具。\n\n其实不是，很多时候你花了大钱，家里看起来还是很挤，因为问题根本不在空间大小，而是布局出了状况。\n\n如果你想不用装修也能改变空间，可以先检查下面这三个地方。\n\n第一个，沙发控制在 180cm 左右。很多人为了追求舒服，买那种很大的 L 型沙发，结果一进门，客厅的动线完全被堵死。换成小一点的尺寸，或者加一张移动推车，客厅马上就能多出一条走路的通道，视觉上也会松很多。\n\n第二个，别让每件家具都贴着墙。如果把所有东西都靠墙放，中间空出来的那块地方反而变成了零碎的杂物堆。留一点空隙，让家具跟墙面有一点距离，空间反而会看起来比较有呼吸感。\n\n第三个，灯光不要只用天花板的主灯。房间看起来小，往往是因为角落太暗。在床头加一盏床头灯，或者放一个落地灯，把角落的阴影打亮，整个房间的层次感就出来了，而且预算根本不用花太多。\n\n【剪辑:这里放案例画面】\n\n以前很多客户搬进 500 到 900 sqft 的 condo 时，也是去 IKEA 或者网上买了一堆收纳用品，结果尺寸不合、颜色不搭，房间东西多还是觉得很乱。后来我们用 RM699 到 RM1,299 的完整房间改造方案，帮他们重新规划空间布局、配色和收纳，整个房间马上变得整齐舒服，而且大部分东西搬家还能继续带走。\n\n好看很重要，但好住更重要。\n\n如果你现在也为小户型和收纳头痛，可以先点我们主页的链接，申请免费的 15 分钟线上空间诊断，让我们的设计师帮你看看目前最大的问题在哪里。\n\n不用装修，也可以变很多。", "tags": "Apple, iphoneduo, consumertech, AIdatacenters, memorychips", "bait": false, "type": "Video", "likes": 7561, "comments": 168, "er": 0.15, "followers": 5034571, "date": "2026-09-11", "url": "https://www.instagram.com/p/DdKb5EsDzCY/", "video": true, "ratio": 0, "score": 0.16, "status": "未处理", "x": 2.7}, {"id": "DdWrb5qFJXt", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "When Shaukat Maredia and his family bought Aga's in 2010, he barely knew how to make a cup of tea. After a steep learning curve and two years of losses, Maredia transformed the restaurant into one of the busiest in the country. \n\nBusiness Insider deputy executive producer Havovi Cooper goes inside Aga's to see how he did it. \n\n#Houston #pakistanifood #indianfood #bigbusiness", "transcript": "For Shaukat, owning a restaurant has come with a big learning curve that continues until today. At the time when we bought this restaurant, the only thing I knew how to make is maybe a cup of tea. Nobody knows anything in my family how to cook. Shaukat's family is from India and Pakistan. He moved to the US when he was 20 years old and picked up work wherever he could. I had three or four jobs going from dry cleaners and working for auto dealership. Then in 2010, his family approached him with an idea to buy a struggling restaurant. One of my brothers, Karim, and one of my cousins came to me and said, hey, this restaurant is for sale. Let's buy it. It's very funny that a week before this conversation, I had a really bad experience here. I laughed at it myself. Are you guys crazy? They paid less for the whole restaurant than what it now makes in a single weekend. When we originally acquired this was the space. This one all the way back was 6,000 square foot roughly. And then as we got busier, we needed more space. The first couple of years were not exactly a success. It was tough. It was stressful. Every month, we were losing money. For good two years, everything was wrong. There was no system in place. There was no accountability. Somebody's saying hi to us. We'll go talk to them. Now, so many Dacys come here, I actually ran into people I knew back in Pakistan. Which one? Hi. Malisa Coach. I actually know them. Oh, you can do it. I wondered when I would run into Parsi zoo. How are you doing? When we were kids. I know how to do it. School in the same like van and all of that stuff. So good to see you. So good to see you too, yeah. So what led to Agar's rise? When we bought it, it used to be Agar's Pakistani restaurant. We changed that to Indo Park restaurant. That was a big deal because now people recognize, okay, this is Indian and Pakistani restaurant. So we start getting a lot more customers. The owners focused on expanding the menu and improving the quality of the food. Chokat also went all in on the tech to provide customers with a smoother experience. I always compare Agar's to Apple, Microsoft, Google. What do they do that makes them successful? It's product, service and process.", "brk": "Hook类型: 身份共鸣\n结构: 零经验接盘烂摊子 → 连续两年血亏 → 逆袭成全国最火店铺\n为什么火: 一个完全不懂行的普通人，通过极致的产品与流程实现逆袭，完美触发了观众的逆袭爽感与好奇心。\n改编角度: 讲述一个修手机小白接手濒死档口，靠极致诚信和技术逆袭成商圈销冠的故事。", "my": "如果你的房间只有 500 到 900 平方尺，每次搬家或者刚租下新房子的时候，是不是觉得怎么摆都不对劲？\n\n很多人刚租下或者买下第一套小房子的时候，第一反应都是上网疯狂买一堆收纳盒、置物架，或者干脆花大钱把全屋重新刷漆、做木工，觉得只要把家里塞满收纳工具，或者把能换的家具全换掉，空间自然就会变整齐。\n\n其实不是这样的。很多时候家里看起来乱，不是因为东西真的多到放不下，而是因为你买回来的家具尺寸跟空间比例根本不搭，或者每件家具都没有自己的位置。\n\n空间小最怕的不是小，是东西没有自己的位置。只要用对方法，不用装修，也可以变很多。\n\n第一，沙发不要买太大。如果你的客厅空间有限，沙发控制在 180 厘米左右就够了，别让每件家具都贴着墙，留一点空隙，反而会让空间看起来更松。\n\n第二，先解决最影响生活的那一个问题。不要一次买一堆不知道用在哪里的收纳用品，先看看是动线太挤还是柜子高度不对，先解决最影响生活的那一个问题，少买一点，买对一点。\n\n第三，把灯光和氛围做起来。预算有限的时候，先换一盏床头灯或者氛围灯，比起花大钱买大件家具，灯光对空间质感的提升最快，也最实用。\n\n以前我们遇到很多刚搬进小型 condo 的年轻人，自己去买了一堆东西回来，最后发现颜色不搭、尺寸不合，每天回家还是觉得压力很大，不知道怎么下手。\n\n后来他们试着调整了家具的尺寸和布局，不再盲目跟风买一堆用不到的东西，只花了一点预算，把最乱的角落重新规划了一下，整个家立刻变得整齐舒服，每天回家都有完全不一样的感觉。\n\n如果你现在也为小户型的空间头疼，不知道该怎么摆放家具，可以先点击主页链接，申请免费的 15 分钟线上空间诊断，把你的房间照片发给我们，我们来帮你看看目前最需要先改善的是哪一个地方。\n\n好看很重要，但好住更重要。", "tags": "Houston, pakistanifood, indianfood, bigbusiness", "bait": false, "type": "Video", "likes": 5789, "comments": 86, "er": 0.12, "followers": 5034925, "date": "2026-09-16", "url": "https://www.instagram.com/p/DdWrb5qFJXt/", "video": true, "ratio": 0, "score": 0.12, "status": "未处理", "x": 2.0}, {"id": "DdSGtgxGygr", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Some CEOs have very strict agendas, but Julie Chapon, the 39-year-old CEO and cofounder of Yuka, doesn't like her day to be too defined.\n\nChapon used to work at a consultancy firm where she had no choice in what she did. When she started Yuka in France around 10 years ago, Chapon thought, \"OK, now no one's going to tell me what I have to do.\"\n\nYuka grew very quickly, and Chapon says she learned to say no, in a very polite way, to 80% of the emails she receives. Yuka has a yearly road map that she’s in charge of. “If I spend my time doing other things, I can't deliver,” Chapon says. \n\nChapon also said she used to put up barriers because she didn't feel like the right person for certain opportunities, even if she was. Now she just acts, and legitimacy comes.\n\nRead more about what a day in Chapon’s life as CEO looks like at the link in our bio.\n\nAs told to Kashmira Gander\n\n(Credit: Adélaïde Chantilly)\n\n#CEO #diml #dayinthelife", "transcript": "", "brk": "Hook类型: 身份共鸣\n结构: 痛点引入 → 创业逆袭 → 核心方法论 → 开放式结局\n为什么火: 真实展现知名CEO反常规的日常，打破大众对精英高压生活的刻板印象。\n改编角度: 拍修手机老板的一天，展示如何靠拒绝奇葩客户和无理要求高效赚钱。", "my": "很多人一搬进新的出租屋或者小户型，就觉得每天的时间完全不够用，生活被琐事塞得满满的，连想安静坐一会儿都很难。\n\n你可能以为，这是因为你的房子实在太小了，或者是因为你买的东西实在太多了，每天光是收拾房间就要花掉大半个晚上。\n\n其实不是这样的。很多时候，空间看起来乱，并不是因为房间真的没有地方放东西，而是你没有学会给生活做减法，把太多不需要的东西和无效的摆设全部塞进了家里。\n\n如果你每天下班回到家，总觉得客厅和卧室到处都是杂物，不妨先试着做这三个最简单、也最容易上手的调整。\n\n第一个方法，沙发控制在 180cm 左右，而且千万不要让每件家具都贴着墙放。留一点空隙，你会发现客厅的动线瞬间变顺了，空间看起来也没有那么压抑。\n\n第二个方法，先别急着在网上一股脑买各种收纳箱。空间小的时候，东西越收越多反而更乱。你可以先检查一下，是不是有很多东西其实根本用不上，先把这些不用的东西清理掉，比买任何收纳用品都管用。\n\n第三个方法，如果预算有限，比如只有 RM500 左右，先别急着去换大件的沙发或者衣柜。你可以先把灯光和窗帘换掉，改用比较柔和的氛围灯，整个房间的质感一下子就会变得很不一样。\n\n以前很多客户自己摸索的时候，也是天天在网上看各种好看的图片，去买了一堆收纳用品和家具回来，结果尺寸不合、颜色不搭，房间依然很挤很乱，每天光是看着就觉得心烦。\n\n后来他们试着按照空间比例和实际动线重新规划，不再盲目跟风买东西，只是把家具摆在正确的位置，再配合合适的灯光，整个房间不仅变得整整齐齐，每天住起来也舒服很多。\n\n如果你现在也正为了家里空间小、东西多、不知道怎么布置而烦恼，可以点击主页链接，申请免费的 15 分钟线上空间诊断。发几张房间照片给我们，我们会帮你找出目前最大的问题，告诉你哪些地方可以先调整。\n\n不用装修，也可以变很多。先别急着买家具，把现有的空间用对，每天住的地方就能变得更舒服一点。", "tags": "CEO, diml, dayinthelife", "bait": false, "type": "Image", "likes": 3964, "comments": 137, "er": 0.08, "followers": 5034571, "date": "2026-09-14", "url": "https://www.instagram.com/p/DdSGtgxGygr/", "video": false, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "DdmGr6OFAzS", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "A layoff can turn everyday expenses into major decisions. These former tech workers explain how they adjusted their finances after losing high-paying jobs.\n\nFor some laid-off tech workers, severance ran out fast, leading them to sell stocks, rely on family, or make plans to relocate. \n\nHead to the link in our bio to learn more about what happens after you lose a six-figure job at one of the world's biggest tech companies.\n\n#bigtech #finances #lifelessons #layoff #career #jobs", "transcript": "Getting laid off definitely will show you where you went wrong with your finances. I am going to relocate to Charlotte, North Carolina because DC rent is way too much for me. The mortgage payment is something that drains our debts. We do think about maybe selling this house or bringing it up for rent. Everything is on the table, right? Moving is on the table. Once the severance was gone, I had to use up the savings that I was building. I had to sell stocks. I had to depend on my mom and dad for their support, which was really hard. It has definitely impacted the future plans I had, which eventually was hopefully to buy a house, to be able to buy my parents a house, to help them retire. I changed my spending habits to align more with my lack of income. You go out less, you cook more at home, you close out Netflix accounts or something like that, right? Things that are more entertainment versus essentials. One thing I did when I joined Google was actually planning a lot of my finances around the potential of being laid off. I kept a lot of my savings in cash, and I also didn't fully max out my retirement just because when you're laid off, the last thing you would want to worry about is, like, oh, how can I withdraw from my 401k or something? It's super scary at first. When you start pulling money out, you're just like, okay, here we go. How's this going to go? The biggest money lesson is invest, invest, invest. If you're saving, make sure that it is a high interest saving account so that your money isn't just sitting there, but also when you're purchasing, keep in mind, if I didn't have an income, would I still be able to afford this? I don't think that I plan for the what-ifs, and it costs me dearly. I would say the largest stressor for finances at right now is probably health insurance. In this country without health care, it could drain your accounts quite quickly. I've had medical provided my employer my entire life. I never have thought about this before. We pay $2,600 a month for medical, so that's a wake-up call to reality that a lot of Americans experience and have experienced all their life.", "brk": "Hook类型: 痛点直击\n结构: 遭遇裁员变故 → 盘点财务窘境与应对 → 反思与金钱教训\n为什么火: 直击大厂裁员背景下的财务焦虑，引发高薪群体的生存共鸣\n改编角度: 聚焦手机突然损坏但没钱修的窘境，探讨果粉/大厂员工的突发财务压力", "my": "如果你的租屋合同快到期了，或者刚搬进一间新的出租屋，你可能会发现，现实和想象中真的不太一样。\n\n很多朋友刚拿到钥匙的时候，总觉得要把客厅、卧室、厨房全部重新填满，去买一堆网红家具或者收纳用品，才能把房子变成理想的样子。\n\n其实不是你家太小，是东西没有自己的位置。很多人最后花了一大笔钱，买回来才发现尺寸不合或者颜色不搭，不仅钱包受不了，家里看起来还是乱糟糟的。\n\n如果空间总觉得有点乱，可以先检查这三个地方。第一个，沙发如果买得太大，客厅的动线就会直接卡住。建议把沙发控制在 180cm 左右，留一点空隙，反而会让空间看起来更松。\n\n第二个，别急着在网上盲目买一堆收纳盒。小空间最怕的不是小，是东西没有规划好，先解决最影响生活的那一个问题，比如把鞋柜或桌面杂物整理清楚，再考虑要不要添置别的。\n\n第三个，预算不用很大，重点是钱花在哪里。如果只有 RM500 预算，我会先换灯和窗帘，沙发先别动，因为灯光和软装对整体氛围的影响最直接，性价比也最高。\n\n以前大家搬家都是靠感觉瞎买，结果越买越挤，也不知道钱花在了哪里。用对方法以后，你会发现不用装修，也可以变很多。\n\n如果你现在也正为了房间小、东西多而头痛，不知道该怎么摆放才好，可以点击主页链接，申请免费的 15 分钟线上空间诊断，把你的房间照片发给我们。\n\n好看很重要，但好住更重要。", "tags": "bigtech, finances, lifelessons, layoff, career, jobs", "bait": false, "type": "Video", "likes": 4360, "comments": 98, "er": 0.09, "followers": 5034925, "date": "2026-09-22", "url": "https://www.instagram.com/p/DdmGr6OFAzS/", "video": true, "ratio": 0, "score": 0.09, "status": "未处理", "x": 1.5}, {"id": "Ddb0Ldfgka5", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "After Brittney Ball was laid off from Meta, she submitted over 8,000 job applications with no luck. She even looked outside of tech, applying to work as a cashier at Target — but she was rejected. \n\n\"It kind of feels like a humiliation ritual,\" Ball said. \n\nBall and four other Big Tech workers share their experiences searching for employment after job loss. Some of them have decided to find income in other ways beyond traditional full-time jobs. \n\n#BigTech #layoffs #jobsearch #careers #lifelessons", "transcript": "I just didn't anticipate being unemployed for over a year. I've been unemployed for three months now and honestly when I was initially laid off I thought that I would have a job right now. I expected getting a job in maybe six months. Well, it's been a year. How do I explain it? I can't explain it. So far I have applied to about 30 jobs. I did look around for jobs. I just really wasn't very excited about anything. I'm sort of losing my patience. I've applied to over 8,000 jobs. 8,000 applications. 8,000 applications. And a lot of those jobs, they may not actually exist. I have her back from not even one of them, I believe. I think I've maybe gotten 10 final round interviews. And then you hear nothing. They ghosted you. Only to be told that, oh, we hired someone internally. Is it me? Is it them? What's happening? It kind of feels like a humiliation ritual. You do get a sense of loss of confidence. I applied to work cashier at Target and I was denied because I've been in tech for 15 years. I don't have any retail experience. You know, I'm 57. And you know, it is a crowded market. It's filled with young folks just coming into the job market. It's filled with highly skilled people who have just been laid off. There's a lot of them out there. And so how do you differentiate yourself from them? Because the job market is so competitive right now, you need to do something to set yourself apart. You can't just submit for a job these days. You can't just submit a resume and, you know, cross your fingers. To do job search in this market, you have to call attention to yourself. And that means you need to sell yourself more on social media. If you're an extrovert, that's great. If you're an introvert, that's much harder to do. I'm not comfortable with always being on camera. And so, Substack is a way for me to be introverted, but also extroverted in a way. Whatever your superpower is, you showcase it. One thing I focus now more with the free time I have is content creation. And the core of that is really just building something for myself that no one can take away. Today is the first day since I got laid off. And it just feels weird. No morning meetings, no chat messages, no stand up to attend. It is really important for people to have more than one source of income since I started building my own brand. And I posted my layoff story. I have been reached out by a lot of recruiters and even non-tech job opportunities because when you build a personal brand on social media, you're also learning marketing.", "brk": "Hook类型: 痛点直击\n结构: 遭遇裁员绝望求职 → 吐露海投8000次被拒心声 → 转向副业与自媒体自救\n为什么火: 直面大厂裁员与求职地狱模式的残酷现实，引发庞大失业人群强烈共鸣。\n改编角度: 吐槽某些手机店恶意压价或套路维修，引发用户对行业内幕的共鸣与讨论。", "my": "我只是没想到，刚搬进这间小公寓的时候，我以为把房间布置好是一件很简单的事。\n\n我搬进去大概三个月了，一开始以为买几个好看的收纳盒，再照着网上的图片随便拼一拼，房间自然就会变得很整齐。\n\n结果根本不是这样。\n\n我在网上看了无数个装修视频，去 IKEA 和 Shopee 买了一堆架子和箱子回来，把整个房间塞得满满当当。\n\n可是东西不但没有变少，家里反而变得更挤了，连走动都觉得卡手。\n\n买回来的柜子尺寸跟墙面根本不合，颜色深浅也不搭，整个空间看起来乱糟糟的，一点安全感都没有。\n\n我开始怀疑，是不是我的户型太小了，或者是不是我真的没有布置房子的天分？\n\n其实不是你的家太小，也不是你买的东西不够多。\n\n小空间最怕的不是小，是东西没有自己的位置。\n\n如果你的客厅本来就不大，就别让每件家具都贴着墙，留一点空隙，反而会让空间看起来更松。\n\n今天就跟大家分享三个不用大动干戈，普通人自己在家就能做到的空间调整方法。\n\n第一个方法，检查你家沙发的尺寸和摆放。\n\n如果你的客厅只有 600 sqft，先不要买那种超过 200cm 的大沙发。\n\n把沙发控制在 180cm 左右，并且试着让沙发和墙壁之间留出一点距离，不要把整个角落塞满。\n\n这样调整之后，客厅的视觉动线会变得更顺畅，走动的时候不会一直撞到东西。\n\n第二个方法，不要盲目买一堆抽屉和塑料盒来堆在地上。\n\n如果你家里总觉得很乱，先检查最影响生活的那一个问题，通常是杂物没有集中收纳。\n\n你可以利用墙面空间，装几个 RM25 到 RM120 之间的简单置物架，把常用的东西竖着摆放，腾出地面。\n\n这样桌面干净了，房间的视觉重心就会往上移，空间自然看起来大了一圈。\n\n第三个方法，调整屋里的灯光色温。\n\n很多出租屋看起来冷冰冰的，其实是因为只用了刺眼的白炽灯。\n\n换一个 RM49 到 RM250 左右的床头灯或者氛围灯，把色温调暖一点。\n\n光线有层次了，整个房间的质感立刻就出来了，根本不需要花大钱去重新刷墙。\n\n很多找我们的客户，一开始也觉得小户型只能将就着住，买了一堆收纳用品却还是很乱。\n\n其实只要稍微调整一下家具的比例，把钱花在刀刃上，不用装修也能变很多。\n\n如果你现在也觉得家里空间小、东西多、不知道怎么布置，可以先点我们主页的链接，申请一次免费的 15 分钟线上空间诊断。\n\n把房间照片发给我们，我们来帮你看看目前最需要先解决的是哪一个问题。", "tags": "BigTech, layoffs, jobsearch, careers, lifelessons", "bait": false, "type": "Video", "likes": 3698, "comments": 111, "er": 0.08, "followers": 5034925, "date": "2026-09-18", "url": "https://www.instagram.com/p/Ddb0Ldfgka5/", "video": true, "ratio": 0, "score": 0.08, "status": "未处理", "x": 1.3}, {"id": "Ddolyozicfu", "tracker": "Ivan-Test-Viral 竞对", "competitor": "businessinsider", "caption": "Hospital food doesn't have to be bland. At Northwell Health, a hospital network in New York, chefs are taking the lead on menus, with dietitians guiding them to meet patients' medical needs.\n\nFor patients with swallowing difficulties, for example, chefs create made-from-scratch pureed meals like saucy salmon and short ribs. \n\nLearn more about how fine dining chefs are making their mark on hospital food at the link in bio. \n\n#kitchen #finedining #restaurant #michelin #bigbusiness", "transcript": "Hospital chefs can't use as many ingredients as a typical restaurant kitchen. They have to follow strict dietary requirements, including limits on sodium and fat. When I started, the dietitians were running the ki e whole day. Most of the spices come straight from the mothernance, India and Pakistan. And the chefs are pretty secretive about the different blends because it's what makes their recipes special. You can even grind it. Yes, you can grind it. You can add whole spices and then grind it to know what ingredients we need. Wow, that's a lot of chili spice. That's amazing. One of their most huge spices is chili powders. It comes from India. They go through more than 40 pounds a day. And one of their most expensive ones is saffron, also from India. Probably 5 hours will cost you over 60-70 dollars. Buy the best ingredients available in the market. Don't worry about what the cost is. It's important to our customers, important to my chefs. Back in the kitchen, the team is gearing up for the Friday lunch rush. They're about to turn out nearly 100 South Asian dishes. But there's a twist. Like with so many restaurant kitchens in America, a lot of the people cooking the food are Latino. I kind of love that this moment just happened. Basically, he just said thank you brother in two different languages in Spanish. Gracias, bye. In Urdu. And it kind of captures the teamwork between the two cultures here. The Latino workers and the South Asian front of house as well.", "brk": "Hook类型: 展示成果\n结构: 黄金招牌菜品展示 → 惊人食材消耗量揭秘 → 东西方文化融合的高潮\n为什么火: 用极致的规模数据与跨文化温情故事打破了观众认知\n改编角度: 拍摄修手机店每天消耗多少原装屏及各族裔师傅的协作日常", "my": "如果你的空间本来就不大，每天一进门，总觉得东西堆得满满的，不知道该怎么摆才好。\n\n很多人搬进第一间出租屋或者小型 condo 的时候，以为只要去买一堆收纳用品回来，或者把每件家具都贴着墙放，家里就能变整齐。\n\n但其实不是这样。很多时候，空间看起来乱，不是因为东西真的多到放不下，而是家具的尺寸和布局没有选对，每个东西都没有自己的位置。\n\n如果你也有这种困扰，可以先试着做这三个调整。\n\n第一，先别急着买家具，把沙发控制在 180cm 左右。如果客厅本来就不大，就别让沙发把整个墙面占满，留一点空隙，反而会让空间看起来更松。\n\n第二，看看你家里的 corner 有没有被浪费掉。很多时候，大家习惯把大件柜子全塞在同一面墙，其实只要利用角落放一个置物架或者移动推车，就能把零散的杂物收纳好，动线也会顺很多。\n\n第三，处理灯光的时候，少用那种全屋只靠一盏大白光的吸顶灯。换成局部的氛围照明，加一盏床头灯或者落地灯，空间的层次一下子就出来了，每天回家的时候也会觉得更舒服。\n\n很多刚搬进 500 到 900 sqft 的上班族，在找到我们之前，都自己去 Shopee、Taobao 买了一堆东西，结果发现颜色不搭、尺寸不对，家里还是乱糟糟的。\n\n【剪辑:这里放案例画面】\n\n以前他们只能自己在网上一张一张看图片，买回来发现不实用又只能堆在角落。后来通过我们的 const DATA = JSON.parse(document.getElementById('data').textContent);
const SUPA = 'https://ijptmjiuyifrwqbcxukt.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqcHRtaml1eWlmcndxYmN4dWt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyOTgxNzgsImV4cCI6MjEwMzg3NDE3OH0.lsOQ7XuUcNDklnJmBAk0LcW-epz3uI0GoABLD2ktcaU';
const STATUSES = ["未处理", "拍摄中", "已处理", "跳过"];
document.getElementById('updated').textContent = '更新于 2026-09-25 17:52 (GMT+8)';
const PAGE = 48;
let shown = PAGE;
let videoOnly = false;
let curTab = '全部';

const $ = id => document.getElementById(id);
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);
const getKey = () => ANON;  // anon key is baked in — safe, can only change status
const I = n => '<svg class="ic"><use href="#i-' + n + '"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byRec = {}; DATA.forEach(d => byRec[d.id] = d);
const TRENDS = [["shotoniphone18pro", 5], ["newtrick", 2], ["apple", 2], ["houston", 2], ["texasfood", 2], ["bigbusiness", 2]];
DATA.forEach(d => {
  d.days = d.date ? Math.max(0, Math.floor((Date.now() - new Date(d.date + 'T00:00:00')) / 864e5)) : null;
  d.horse = d.followers > 0 && d.followers < 50000 && ((d.x || 0) >= 2 || d.score >= 10);
});
const PRESETS = [
  { k: 'px', icon: 'trend', label: '真爆款 ×2+', f: d => (d.x || 0) >= 2 },
  { k: 'pn', icon: 'star', label: '近7天', f: d => d.days !== null && d.days <= 7 },
  { k: 'ph', icon: 'zap', label: '黑马', f: d => d.horse },
  { k: 'pb', icon: 'magnet', label: '引流帖', f: d => d.bait },
];
const presetOn = {};

function toast(msg, ok) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  t.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// filters
const comps = [...new Set(DATA.map(d => d.competitor))].sort();
comps.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = '@'+c; $('fComp').appendChild(o); });
[...new Set(DATA.map(d => d.tracker))].forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('fTracker').appendChild(o); });

function matchQ(d) {
  const q = ($('fSearch').value || '').trim().toLowerCase();
  return !q || (d.caption + ' ' + (d.tags || '') + ' ' + (d.transcript || '') + ' ' + (d.brk || '') + ' ' + d.competitor).toLowerCase().includes(q);
}

function basePool() {
  const t = $('fTracker').value, c = $('fComp').value;
  return DATA.filter(d => (!t || d.tracker === t) && (!c || d.competitor === c) && (!videoOnly || d.video)
    && matchQ(d) && PRESETS.every(p => !presetOn[p.k] || p.f(d)));
}

function filtered() {
  const s = $('fSort').value;
  let arr = basePool().filter(d => curTab === '全部' || d.status === curTab);
  const key = { score:'score', er:'er', comments:'comments', likes:'likes', x:'x' }[s];
  if (s === 'date') arr.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else arr.sort((a,b) => (b[key]||0) - (a[key]||0));
  return arr;
}

let dragRec = null;

function renderTabs() {
  const pool = basePool();
  const counts = { '全部': pool.length };
  STATUSES.forEach(s => counts[s] = pool.filter(d => d.status === s).length);
  $('tabs').innerHTML = '';
  ['全部', ...STATUSES].forEach(name => {
    const el = document.createElement('div');
    el.className = 'tab' + (curTab === name ? ' on' : '') + (name !== '全部' ? ' droppable' : '');
    el.innerHTML = esc(name) + ' <span class="cnt">' + counts[name] + '</span>';
    el.onclick = () => { curTab = name; shown = PAGE; render(); };
    if (name !== '全部') {
      el.ondragover = e => { if (dragRec) { e.preventDefault(); el.classList.add('over'); } };
      el.ondragleave = () => el.classList.remove('over');
      el.ondrop = e => {
        e.preventDefault(); el.classList.remove('over');
        const d = byRec[dragRec]; dragRec = null;
        if (d && d.status !== name) setStatus(d, name);
      };
    }
    $('tabs').appendChild(el);
  });
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const el = e.target, pid = el.dataset.pid;
      if (!el.querySelector('iframe')) {
        const f = document.createElement('iframe');
        f.src = 'https://www.instagram.com/p/' + pid + '/embed/';
        f.loading = 'lazy'; f.allow = 'autoplay; encrypted-media';
        el.appendChild(f);
      }
      io.unobserve(el);
    }
  });
}, { rootMargin: '400px' });

async function setStatus(d, val) {
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?post_id=eq.' + encodeURIComponent(d.id), {
      method: 'PATCH',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: val })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d.status = val;
    cacheStatus(d.id, val);
    toast('✓ @' + d.competitor + ' 已移到「' + val + '」', true);
  } catch (e) {
    toast('更新失败: ' + e.message + (String(e.message).includes('401') || String(e.message).includes('403') ? ' — 密钥无效?' : ''), false);
  }
  render();
}

function card(d, idx) {
  const el = document.createElement('div');
  el.className = 'card' + ((d.x || 0) >= 2 ? ' outlier' : '');
  el.style.animationDelay = Math.min(idx % PAGE, 14) * 30 + 'ms';
  el.draggable = true;
  el.ondragstart = e => {
    dragRec = d.id;
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('lifting');
    document.body.classList.add('dragging');
  };
  el.ondragend = () => {
    el.classList.remove('lifting');
    document.body.classList.remove('dragging');
    dragRec = null;
  };
  const typeIcon = d.video ? 'video' : (d.type === 'Carousel' ? 'layers' : 'image');
  const days = d.days, horse = d.horse;
  const ago = days === null ? '' : (days === 0 ? '今天' : days + '天前');
  const lines = (d.caption || '').split('\n').map(l => l.trim()).filter(Boolean);
  const hook = lines[0] || '';
  const tr = (d.transcript && d.transcript !== '(转录失败)' && d.transcript !== '(无口播内容)') ? d.transcript : '';
  el.innerHTML = `
    <div class="embed" data-pid="${d.id}"><div class="ph"><svg class="ic"><use href="#i-${typeIcon}"/></svg></div></div>
    <div class="meta">
      <div class="row1">
        <span class="handle" title="拖到上方 tab 即可归类">${I('grip')}</span>
        <a class="who" href="https://www.instagram.com/${d.competitor}/" target="_blank">@${d.competitor}</a>
        <span class="badge">${d.type || '-'}</span>
        ${days !== null && days <= 7 ? '<span class="badge bnew">' + I('star') + '新帖</span>' : ''}
        ${horse ? '<span class="badge bhorse">' + I('zap') + '黑马</span>' : ''}
        ${d.bait ? '<span class="badge bbait" title="「留言XX」引流打法 — 评论被引流放大,漏斗设计值得学">' + I('magnet') + '引流</span>' : ''}
        <span class="date" title="${d.date || ''}">${ago}</span>
      </div>
      <div class="nums">
        <span class="num hot" title="Viral Score">${I('flame')}<b>${d.score}</b></span>
        ${(d.x || 0) >= 2 ? '<span class="num x" title="是自家平均热度的多少倍">' + I('trend') + '<b>×' + d.x + '</b></span>' : ''}
        <span class="num er" title="Engagement Rate">${I('pct')}<b>${d.er}%</b></span>
        <span class="num" title="Likes">${I('heart')}<b>${d.likes > 0 ? fmt(d.likes) : '隐藏'}</b></span>
        <span class="num" title="Comments">${I('msg')}<b>${fmt(d.comments)}</b></span>
        <span class="num" title="Followers">${I('users')}<b>${fmt(d.followers)}</b></span>
      </div>
      <div class="cap" onclick="this.classList.toggle('open')"></div>
      ${d.brk ? '<div class="ai" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      ${d.my ? '<div class="mine" onclick="this.classList.toggle(&quot;open&quot;)"></div>' : ''}
      <div class="srow"><label>状态</label><select class="status btn s${d.status}"></select>
        <button class="abtn copy" title="复制完整文案">${I('copy')}文案</button>
        ${tr ? '<button class="abtn mic" title="复制视频口播逐字稿">' + I('mic') + '口播</button>' : ''}
        ${d.my ? '<button class="abtn minec" title="复制我的改写口播稿(可直接拍)">' + I('mic') + '我的稿</button>' : ''}
        <button class="abtn brief" title="复制拍摄 Brief(数据+Hook+AI拆解+我的稿+口播稿+文案)">${I('clip')}Brief</button>
        <a class="abtn" href="${d.url}" target="_blank" title="打开 Instagram 原帖">${I('ext')}</a></div>
    </div>`;
  const capEl = el.querySelector('.cap');
  const restTxt = lines.slice(1).join('\n');
  capEl.innerHTML = hook ? '<b>' + esc(hook) + '</b>' + (restTxt ? '<br>' + esc(restTxt).replace(/\n/g, '<br>') : '') : '';
  const aiEl = el.querySelector('.ai');
  if (aiEl) aiEl.innerHTML = '<b>💡 AI 拆解</b><br>' + esc(d.brk).split(String.fromCharCode(10)).join('<br>');
  const myEl = el.querySelector('.mine');
  if (myEl) myEl.innerHTML = '<b>🎬 我的版本(可直接拍)</b><br>' + esc(d.my).split(String.fromCharCode(10)).join('<br>');
  const sel = el.querySelector('.status');
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
  sel.value = d.status;
  sel.onchange = () => setStatus(d, sel.value);
  el.querySelector('.copy').onclick = () =>
    navigator.clipboard.writeText(d.caption || '').then(() => toast('✓ 文案已复制', true));
  const micBtn = el.querySelector('.mic');
  if (micBtn) micBtn.onclick = () =>
    navigator.clipboard.writeText(tr).then(() => toast('✓ 口播稿已复制', true));
  const mineBtn = el.querySelector('.minec');
  if (mineBtn) mineBtn.onclick = () =>
    navigator.clipboard.writeText(d.my).then(() => toast('✓ 我的改写稿已复制', true));
  el.querySelector('.brief').onclick = () => {
    const NL = String.fromCharCode(10);
    const parts = ['🎬 爆款参考 @' + d.competitor + ((d.x || 0) >= 2 ? '(自家平均 ×' + d.x + ')' : ''),
      '📊 🔥' + d.score + ' | ER ' + d.er + '% | ❤️ ' + (d.likes > 0 ? fmt(d.likes) : '隐藏') +
      ' | 💬 ' + fmt(d.comments) + ' | 👥 ' + fmt(d.followers) + (ago ? ' | ' + ago : ''),
      '🔗 ' + d.url, '✍️ Hook: ' + hook];
    if (d.brk) parts.push('——— AI 拆解 ———', d.brk);
    if (d.my) parts.push('——— 我的版本(可直接拍)———', d.my);
    if (tr) parts.push('——— 竞对原口播稿 ———', tr);
    parts.push('——— 完整文案 ———', d.caption || '');
    navigator.clipboard.writeText(parts.join(NL)).then(() => toast('✓ Brief 已复制,可直接发给拍摄/剪辑', true));
  };
  io.observe(el.querySelector('.embed'));
  return el;
}

function render() {
  renderTabs();
  const arr = filtered();
  const grid = $('grid'); grid.innerHTML = '';
  arr.slice(0, shown).forEach((d, i) => grid.appendChild(card(d, i)));
  $('empty').style.display = arr.length ? 'none' : '';
  $('moreWrap').style.display = arr.length > shown ? '' : 'none';
}


function applyStatusCache() {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    Object.keys(c).forEach(rid => { const d = byRec[rid]; if (d) d.status = c[rid]; });
  } catch (e) {}
}

function cacheStatus(rid, val) {
  try {
    const c = JSON.parse(localStorage.getItem('st_cache') || '{}');
    c[rid] = val; localStorage.setItem('st_cache', JSON.stringify(c));
  } catch (e) {}
}

// live status refresh (so weekly-baked page shows current statuses)
async function refreshStatuses() {
  applyStatusCache(); render();  // last-known statuses first
  if (Date.now() - (+localStorage.getItem('st_ts') || 0) < 600000) return;  // 10-min throttle
  localStorage.setItem('st_ts', String(Date.now()));
  const fresh = {};
  try {
    const r = await fetch(SUPA + '/rest/v1/posts?select=post_id,status', { headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(row => {
      const d = byRec[row.post_id];
      if (d) d.status = row.status || '未处理';
      if (row.status && row.status !== '未处理') fresh[row.post_id] = row.status;
    });
    localStorage.setItem('st_cache', JSON.stringify(fresh));
    render();
  } catch (e) {}
}

['fTracker','fComp','fSort'].forEach(id => $(id).onchange = () => { shown = PAGE; render(); });
$('fSearch').oninput = () => { shown = PAGE; render(); };
$('fVideo').onclick = () => { videoOnly = !videoOnly; $('fVideo').classList.toggle('on', videoOnly); shown = PAGE; render(); };
$('moreBtn').onclick = () => { shown += PAGE; render(); };

// preset quick filters
$('presets').innerHTML = '<span class="lbl">快筛</span>';
PRESETS.forEach(p => {
  const c = document.createElement('span'); c.className = 'chip2';
  c.innerHTML = I(p.icon) + esc(p.label);
  c.onclick = () => { presetOn[p.k] = !presetOn[p.k]; c.classList.toggle('on', presetOn[p.k]); shown = PAGE; render(); };
  $('presets').appendChild(c);
});

// trending hashtags among outlier posts
if (TRENDS.length) {
  $('trends').innerHTML = '<span class="lbl">爆款热词</span>';
  TRENDS.forEach(([tag, n]) => {
    const c = document.createElement('span'); c.className = 'chip2';
    c.textContent = '#' + tag + ' ' + n;
    c.onclick = () => { $('fSearch').value = $('fSearch').value === tag ? '' : tag; shown = PAGE; render(); };
    $('trends').appendChild(c);
  });
} else { $('trends').style.display = 'none'; }

render();
refreshStatuses();
</script>
</body>
</html>
